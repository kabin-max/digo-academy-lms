version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --legacy-peer-deps
        - mkdir -p .next
        - mv .next-cache .next/cache || true
    build:
      commands:
        # Run Prisma migrations to update the database schema
        - npx prisma migrate deploy
        # Build the Next.js application
        - npm run build
        - mv .next/cache .next-cache || true
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next-cache/**/*
