version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Run Prisma migrations to update the database schema
        - npx prisma migrate deploy
        # Build the Next.js application
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
      - '!cache/**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
