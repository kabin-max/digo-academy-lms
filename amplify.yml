version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Show build environment info
        - echo "Build Environment Setup"
        - node --version
        - npm --version
        # Set dummy environment variables for build if not provided
        - export DATABASE_URL="${DATABASE_URL:-postgresql://dummy:dummy@localhost:5432/dummy}"
        - export DIRECT_URL="${DIRECT_URL:-postgresql://dummy:dummy@localhost:5432/dummy}"
        - export BETTER_AUTH_SECRET="${BETTER_AUTH_SECRET:-dummy_secret_for_build_only}"
        - export BETTER_AUTH_URL="${BETTER_AUTH_URL:-https://localhost:3000}"
        - export NODE_ENV="production"
        # Install dependencies with legacy peer deps for compatibility
        - npm ci --legacy-peer-deps
        # Setup cache directories
        - mkdir -p .next
        - mv .next-cache .next/cache || echo "No cache to restore"
    build:
      commands:
        # Re-set environment variables (exports from preBuild do not persist across phases)
        - export DATABASE_URL="${DATABASE_URL:-postgresql://dummy:dummy@localhost:5432/dummy}"
        - export DIRECT_URL="${DIRECT_URL:-postgresql://dummy:dummy@localhost:5432/dummy}"
        - export BETTER_AUTH_SECRET="${BETTER_AUTH_SECRET:-dummy_secret_for_build_only}"
        - export BETTER_AUTH_URL="${BETTER_AUTH_URL:-https://localhost:3000}"
        - export NODE_ENV="production"
        # Generate Prisma client using the LOCAL binary (avoid npx fetching a wrong version)
        - echo "Generating Prisma client..."
        - ./node_modules/.bin/prisma generate
        # Run database migrations BEFORE pruning (pruning removes the prisma binary)
        - |
          if [ -n "$DATABASE_URL" ] && [[ "$DATABASE_URL" != *"dummy"* ]]; then
            echo "Running database migrations..."
            ./node_modules/.bin/prisma migrate deploy
            echo "Database migrations completed"
          else
            echo "Skipping database migrations (no production database configured)"
          fi
        # Build Next.js application using the LOCAL binary
        - echo "Building Next.js application..."
        - ./node_modules/.bin/next build
        # Run pruning script to optimize bundle size (removes prisma CLI, engines, etc.)
        - echo "Optimizing bundle size..."
        - node prune-amplify.js || echo "Pruning script not found, skipping"
        # Optimize cache for next build
        - mv .next/cache .next-cache || echo "No cache to save"
        - echo "Build process completed successfully!"
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next-cache/**/*
